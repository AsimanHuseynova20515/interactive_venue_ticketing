<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asiman Theatre – Ticketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="nav-top">
    <a href="#" class="brand">
      <span>ASIMAN <small>THEATRE</small></span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#" class="nav-link active">Home</a>
      <a href="#shows" class="nav-link">Shows</a>
      <a href="#map-area" class="nav-link">Seat Map</a>
      <a href="#cart" class="nav-link">My Tickets</a>
    </nav>

  </div>

  <div class="header-info">
    <ul id="legend" aria-label="Price categories"></ul>

    <ul id="state-legend" aria-label="Seat states">
      <li><i class="sw s-available"></i>Available</li>
      <li><i class="sw s-inspected"></i>Inspected</li>
      <li><i class="sw s-incart"></i>In cart</li>
      <li><i class="sw s-unavailable"></i>Sold</li>
    </ul>
  </div>
</header>

<main>
  <section id="map-area">
    <div id="controls" role="group" aria-label="Map navigation">
      <button data-act="in"    aria-label="Zoom In" title="Zoom In">+</button>
      <button data-act="out"   aria-label="Zoom Out" title="Zoom Out">−</button>
      <button data-act="up"    aria-label="Move Up" title="Move Up">↑</button>
      <button data-act="down"  aria-label="Move Down" title="Move Down">↓</button>
      <button data-act="left"  aria-label="Move Left" title="Move Left">←</button>
      <button data-act="right" aria-label="Move Right" title="Move Right">→</button>
      <button data-act="reset" aria-label="Reset / Center View" title="Reset / Center View">⟲</button>
    </div>
    <div id="viewport"><div id="map"></div></div>
  </section>

  <aside>
    <section id="details">
      <h2>Seat details</h2>
      <div id="detail-body">Select a seat on the map.</div>
      <button id="add-btn" disabled>ADD TO CART</button>
    </section>
    <section id="cart">
      <h2>Cart</h2>
      <ul id="cart-list"></ul>
      <p>Total: <strong id="total">0</strong> $</p>
    </section>
  </aside>
</main>

<script src="js/data.js"></script>
</body>
</html>
